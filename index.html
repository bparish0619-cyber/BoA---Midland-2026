<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Parent guide for Abilene Wylie at the 2026 Bands of America West Texas Regional in Midland." />
  <link rel="icon" href="data:," />
  <title>Wylie at BOA West Texas</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap');

    :root {
      color-scheme: light dark;
      --bg: #f4f6f7;
      --surface: #ffffff;
      --surface-2: #e9eef0;
      --ink: #11191e;
      --muted: #55636c;
      --line: #d7dee1;
      --navy: #092a36;
      --teal: #0f7b78;
      --teal-deep: #075c5b;
      --gold: #f5b82e;
      --gold-soft: #fff0be;
      --purple: #6c3d79;
      --purple-soft: #f1e7f4;
      --danger-soft: #fff0e9;
      --shadow: 0 18px 48px rgba(9, 42, 54, .12);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 10px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #091319;
        --surface: #111f26;
        --surface-2: #192a32;
        --ink: #f4f7f8;
        --muted: #b9c6cc;
        --line: #2b404a;
        --navy: #071b24;
        --teal: #4fc7c1;
        --teal-deep: #7bdbd6;
        --gold: #ffc94a;
        --gold-soft: #3d3214;
        --purple: #c690da;
        --purple-soft: #32243a;
        --danger-soft: #3a231d;
        --shadow: 0 18px 48px rgba(0, 0, 0, .28);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Source Sans 3", sans-serif;
      font-size: 17px;
      line-height: 1.5;
    }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    button { font: inherit; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    .hero {
      position: relative;
      min-height: 590px;
      display: grid;
      align-items: end;
      overflow: hidden;
      background: var(--navy);
      color: #fff;
    }
    .hero-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 52% 52%;
      opacity: .5;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(5,24,32,.96) 0%, rgba(5,24,32,.78) 43%, rgba(5,24,32,.2) 76%),
        linear-gradient(0deg, rgba(5,24,32,.92) 0%, transparent 46%);
    }
    .hero-inner {
      position: relative;
      z-index: 1;
      width: min(1160px, calc(100% - 40px));
      margin: 0 auto;
      padding: 72px 0 54px;
    }
    .event-kicker {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      color: #e8f4f4;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .date-chip {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 4px 11px;
      border-radius: 999px;
      background: var(--gold);
      color: #251b02;
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .hero h1 {
      max-width: 760px;
      margin: 0;
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(3.55rem, 8vw, 6.9rem);
      line-height: .88;
      letter-spacing: -.035em;
      text-wrap: balance;
    }
    .hero h1 strong { color: var(--gold); font-weight: 800; }
    .hero-sub {
      max-width: 650px;
      margin: 22px 0 28px;
      color: #e3ecee;
      font-size: clamp(1.05rem, 2vw, 1.25rem);
    }
    .hero-actions, .source-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 750;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, color .18s ease, transform .18s ease;
    }
    .btn:focus-visible, .mini-link:focus-visible, summary:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }
    .btn-primary { background: var(--gold); color: #1f1703; }
    .btn-primary:hover { background: #ffd267; }
    .btn-ghost { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.4); color: #fff; }
    .btn-ghost:hover { background: rgba(255,255,255,.17); }
    .btn svg, .mini-link svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .hero-credit {
      position: absolute;
      z-index: 2;
      right: 18px;
      bottom: 14px;
      color: rgba(255,255,255,.74);
      font-size: .72rem;
      text-decoration: none;
    }
    .hero-credit:hover { color: #fff; }

    .quick-strip {
      position: relative;
      z-index: 3;
      width: min(1080px, calc(100% - 40px));
      margin: -26px auto 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .quick-item { padding: 21px 22px; }
    .quick-item + .quick-item { border-left: 1px solid var(--line); }
    .quick-label {
      display: block;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .quick-value {
      display: block;
      margin-top: 2px;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 1.75rem;
      line-height: 1.05;
      font-weight: 800;
    }
    .quick-note { display: block; color: var(--muted); font-size: .83rem; margin-top: 4px; }

    .page {
      width: min(1160px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0 72px;
    }
    .section { margin-top: 66px; scroll-margin-top: 20px; }
    .section:first-child { margin-top: 0; }
    .section-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 24px;
    }
    .section-heading h2 {
      margin: 0;
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      line-height: .95;
      letter-spacing: -.02em;
    }
    .section-heading p { max-width: 540px; margin: 9px 0 0; color: var(--muted); }
    .mini-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--teal-deep);
      font-weight: 750;
      text-decoration: none;
      white-space: nowrap;
    }
    .mini-link:hover { text-decoration: underline; }

    .plan-grid {
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 22px;
    }
    .spotlight {
      position: relative;
      overflow: hidden;
      padding: 30px;
      border-radius: var(--radius-lg);
      background: var(--navy);
      color: #fff;
    }
    .spotlight::before {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      border: 44px solid rgba(245,184,46,.12);
      border-radius: 50%;
      top: -105px;
      right: -90px;
    }
    .spotlight > * { position: relative; }
    .spotlight h3 {
      margin: 0 0 8px;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 2.4rem;
      line-height: 1;
    }
    .spotlight p { margin: 0; color: #dbe8eb; max-width: 570px; }
    .leave-time {
      margin-top: 28px;
      display: flex;
      align-items: baseline;
      gap: 13px;
    }
    .leave-time strong {
      font-family: "Barlow Condensed", sans-serif;
      color: var(--gold);
      font-size: 3.9rem;
      line-height: .9;
    }
    .leave-time span { max-width: 230px; font-size: .92rem; color: #dbe8eb; }
    .spotlight hr { border: 0; border-top: 1px solid rgba(255,255,255,.18); margin: 25px 0 20px; }
    .travel-facts { display: flex; flex-wrap: wrap; gap: 22px; }
    .travel-facts div { min-width: 110px; }
    .travel-facts b { display: block; font-size: 1.15rem; }
    .travel-facts small { color: #bed0d5; }

    .venue-card {
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 26px;
    }
    .venue-card h3 { margin: 0 0 8px; font-size: 1.22rem; }
    .venue-card address { color: var(--muted); font-style: normal; }
    .copy-status { min-height: 1.3em; margin: 8px 0 0; color: var(--teal-deep); font-size: .86rem; font-weight: 700; }
    .btn-dark { background: var(--ink); color: var(--bg); }
    .btn-dark:hover { opacity: .86; }

    .timeline {
      position: relative;
      padding-left: 30px;
    }
    .timeline::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 9px;
      bottom: 9px;
      width: 2px;
      background: var(--line);
    }
    .timeline-group { margin-bottom: 30px; }
    .timeline-group:last-child { margin-bottom: 0; }
    .timeline-group-label {
      position: relative;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .timeline-group-label::before {
      content: "";
      position: absolute;
      left: -27px;
      top: 5px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 5px var(--bg);
    }
    .time-row {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      gap: 16px;
      align-items: center;
      min-height: 58px;
      padding: 10px 14px;
      border-top: 1px solid var(--line);
    }
    .time-row:last-child { border-bottom: 1px solid var(--line); }
    .time-row time { font-weight: 800; font-variant-numeric: tabular-nums; }
    .time-row strong { display: block; }
    .time-row span { color: var(--muted); font-size: .92rem; }
    .time-row em {
      justify-self: end;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: .76rem;
      font-style: normal;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .time-row.wylie {
      margin: 4px 0;
      border: 0;
      border-radius: 12px;
      background: var(--purple-soft);
      box-shadow: inset 4px 0 var(--purple);
    }
    .time-row.wylie time, .time-row.wylie strong { color: var(--purple); }
    .time-row.wylie em { background: var(--purple); color: #fff; }

    .guide-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .guide-card {
      min-height: 210px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
    }
    .guide-card.wide { grid-column: span 2; }
    .guide-card.weather { background: var(--gold-soft); border-color: transparent; }
    .card-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--teal-deep);
    }
    .weather .card-icon { background: rgba(255,255,255,.55); color: #7b5500; }
    .card-icon svg { width: 21px; height: 21px; }
    .guide-card h3 { margin: 0 0 8px; font-size: 1.15rem; }
    .guide-card p { margin: 0; color: var(--muted); }
    .guide-card ul { margin: 10px 0 0; padding-left: 19px; color: var(--muted); }
    .guide-card li + li { margin-top: 7px; }
    .metric {
      display: flex;
      gap: 24px;
      align-items: flex-end;
      margin-top: 14px;
    }
    .metric strong {
      display: block;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 3.2rem;
      line-height: .9;
    }
    .metric span { display: block; color: var(--muted); font-size: .86rem; }
    .fine-print { margin-top: 14px !important; font-size: .82rem; }

    .ticket-table {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      margin: 18px 0;
    }
    .ticket-cell { padding: 15px; background: var(--surface); }
    .ticket-cell + .ticket-cell { border-left: 1px solid var(--line); }
    .ticket-cell b { display: block; font-size: 1.25rem; }
    .ticket-cell small { color: var(--muted); }

    .callout {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 22px 24px;
      border-radius: var(--radius-md);
      background: var(--surface-2);
    }
    .callout-number {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 3rem;
      line-height: 1;
      font-weight: 800;
      color: var(--teal-deep);
    }
    .callout h3 { margin: 0 0 4px; }
    .callout p { margin: 0; color: var(--muted); }

    details {
      border-top: 1px solid var(--line);
      background: var(--surface);
    }
    details:last-child { border-bottom: 1px solid var(--line); }
    summary {
      list-style: none;
      cursor: pointer;
      padding: 18px 4px;
      font-weight: 750;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; color: var(--teal-deep); font-size: 1.5rem; line-height: 1; }
    details[open] summary::after { content: "−"; }
    details p { margin: -4px 0 20px; color: var(--muted); max-width: 850px; }

    .sources {
      margin-top: 66px;
      padding: 28px;
      border-radius: var(--radius-md);
      background: var(--navy);
      color: #fff;
    }
    .sources h2 { margin: 0 0 8px; font-family: "Barlow Condensed", sans-serif; font-size: 2rem; }
    .sources p { margin: 0 0 18px; color: #c9d7dc; }
    .source-actions a { font-size: .9rem; }
    .as-of { margin-top: 20px !important; font-size: .78rem; color: #aebfc5 !important; }

    .toast {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translate(-50%, 14px);
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 11px 16px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--bg);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      font-weight: 700;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 800px) {
      .hero { min-height: 560px; }
      .hero::after { background: linear-gradient(0deg, rgba(5,24,32,.98) 0%, rgba(5,24,32,.72) 62%, rgba(5,24,32,.32) 100%); }
      .hero-inner { padding-bottom: 78px; }
      .hero-credit { bottom: 50px; }
      .quick-strip { grid-template-columns: 1fr 1fr; }
      .quick-item + .quick-item { border-left: 0; }
      .quick-item:nth-child(even) { border-left: 1px solid var(--line); }
      .quick-item:nth-child(n+3) { border-top: 1px solid var(--line); }
      .plan-grid { grid-template-columns: 1fr; }
      .guide-grid { grid-template-columns: 1fr 1fr; }
      .guide-card.wide { grid-column: span 2; }
    }

    @media (max-width: 560px) {
      body { font-size: 16px; }
      .hero { min-height: 600px; }
      .hero-inner, .page, .quick-strip { width: min(100% - 24px, 1160px); }
      .hero-inner { padding-top: 48px; }
      .hero h1 { font-size: clamp(3.25rem, 17vw, 5rem); }
      .hero-actions { display: grid; grid-template-columns: 1fr; }
      .hero-actions .btn { width: 100%; }
      .hero-credit { right: 13px; max-width: 80%; text-align: right; }
      .quick-strip { margin-top: -18px; }
      .quick-item { padding: 17px 16px; }
      .quick-value { font-size: 1.5rem; }
      .page { padding-top: 42px; }
      .section { margin-top: 52px; }
      .section-heading { grid-template-columns: 1fr; align-items: start; }
      .section-heading .mini-link { justify-self: start; }
      .spotlight { padding: 24px; }
      .leave-time { display: block; }
      .leave-time span { display: block; margin-top: 8px; }
      .guide-grid { grid-template-columns: 1fr; }
      .guide-card.wide { grid-column: span 1; }
      .time-row { grid-template-columns: 84px 1fr; gap: 10px; padding-left: 6px; padding-right: 6px; }
      .time-row em { grid-column: 2; justify-self: start; margin-top: -7px; }
      .ticket-table { grid-template-columns: 1fr; }
      .ticket-cell + .ticket-cell { border-left: 0; border-top: 1px solid var(--line); }
      .callout { grid-template-columns: auto 1fr; }
      .callout .btn { grid-column: 1 / -1; width: 100%; }
      .source-actions { display: grid; grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }

    @media print {
      .hero { min-height: auto; }
      .hero-photo, .hero::after, .hero-credit { display: none; }
      .hero { color: #000; background: #fff; border-bottom: 3px solid #000; }
      .hero-inner { padding: 20px 0; }
      .hero h1, .hero-sub, .event-kicker { color: #000; }
      .hero-actions, .btn, .mini-link, .toast { display: none !important; }
      .quick-strip { margin-top: 12px; box-shadow: none; }
      .page { padding: 22px 0; }
      .section { margin-top: 28px; break-inside: avoid; }
      .guide-card, .spotlight, .venue-card, .sources { break-inside: avoid; box-shadow: none; }
      .spotlight, .sources { color: #000; background: #fff; border: 1px solid #999; }
      .spotlight p, .sources p { color: #333; }
      details p { display: block; }
    }
  </style>
</head>
